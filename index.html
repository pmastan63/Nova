<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA</title>

  <style>
    body {
      margin: 0;
      background: #f7f7f7;
      font-family: Arial, sans-serif;
      color: #111;
    }

    .box {
      max-width: 400px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      border: 1px solid #ddd;
    }

    h1 {
      text-align: center;
    }

    p {
      text-align: center;
      color: #777;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
    }

    #home {
      display: none;
      text-align: center;
    }

    #error {
      color: red;
      text-align: center;
      margin-top: 15px;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="box" id="login">

    <h1>NOVA 🌌</h1>

    <p>Your world. Connected.</p>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button id="loginButton">
      Login
    </button>

    <div id="error"></div>

  </div>


  <div class="box" id="home">

    <h1>Welcome to NOVA 🌌</h1>

    <p id="welcome"></p>

    <button id="logoutButton">
      Logout
    </button>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyCoFEKP43y_K1R5IAJApQCltckle51uOtI",

      authDomain: "petrax-nova-9b950.firebaseapp.com",

      projectId: "petrax-nova-9b950",

      storageBucket: "petrax-nova-9b950.firebasestorage.app",

      messagingSenderId: "578838882402",

      appId: "1:578838882402:web:a65d56cc913b438712493b"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    const loginButton =
      document.getElementById("loginButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const loginPage =
      document.getElementById("login");

    const homePage =
      document.getElementById("home");

    const error =
      document.getElementById("error");

    const welcome =
      document.getElementById("welcome");


    loginButton.addEventListener(
      "click",
      async () => {

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;


        error.textContent = "";


        if (!email || !password) {

          error.textContent =
            "Please enter your email and password.";

          return;
        }


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        } catch (e) {

          error.textContent =
            e.code + " — " + e.message;

        }

      }
    );


    onAuthStateChanged(
      auth,
      (user) => {

        if (user) {

          loginPage.style.display =
            "none";

          homePage.style.display =
            "block";

          welcome.textContent =
            "You are logged in as " +
            user.email;

        } else {

          loginPage.style.display =
            "block";

          homePage.style.display =
            "none";

        }

      }
    );


    logoutButton.addEventListener(
      "click",
      async () => {

        await signOut(auth);

      }
    );

  </script>

</body>
</html>
