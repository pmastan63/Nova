<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NOVA 🌌</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }


    body {
      background: #f7f7f7;
      color: #111;
    }


    /* =========================
       LOGIN
    ========================= */

    #loginPage {
      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;
    }


    .login-box {
      width: 100%;

      max-width: 400px;

      background: white;

      padding: 30px;

      border-radius: 16px;

      border: 1px solid #ddd;
    }


    .login-logo {
      text-align: center;

      font-size: 34px;

      font-weight: bold;

      margin-bottom: 8px;
    }


    .login-subtitle {
      text-align: center;

      color: #777;

      margin-bottom: 28px;
    }


    input {
      width: 100%;

      padding: 14px;

      margin-bottom: 12px;

      border: 1px solid #ddd;

      border-radius: 9px;

      font-size: 16px;

      outline: none;
    }


    input:focus {
      border-color: #111;
    }


    .login-button {
      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 9px;

      background: #111;

      color: white;

      font-size: 16px;

      cursor: pointer;
    }


    .switch {
      text-align: center;

      margin-top: 18px;

      color: #777;

      cursor: pointer;

      font-size: 14px;
    }


    .switch span {
      color: #111;

      font-weight: bold;
    }


    #message {
      text-align: center;

      margin-top: 15px;

      color: #d00;

      font-size: 14px;

      word-break: break-word;
    }



    /* =========================
       HOME
    ========================= */

    #homePage {
      display: none;

      min-height: 100vh;

      background: #f7f7f7;

      padding-bottom: 30px;
    }


    .top-bar {
      height: 65px;

      background: white;

      border-bottom: 1px solid #e5e5e5;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 20px;

      position: sticky;

      top: 0;

      z-index: 10;
    }


    .nova-title {
      font-size: 22px;

      font-weight: bold;
    }


    .logout-button {
      width: auto;

      padding: 9px 15px;

      border: none;

      border-radius: 8px;

      background: #f0f0f0;

      color: #111;

      cursor: pointer;
    }


    .dashboard {
      max-width: 900px;

      margin: auto;

      padding: 35px 20px;
    }


    .welcome {
      margin-bottom: 30px;
    }


    .welcome h1 {
      font-size: 30px;

      margin-bottom: 8px;
    }


    .welcome p {
      color: #777;

      font-size: 15px;
    }


    /* =========================
       FEATURE CARDS
    ========================= */

    .feature-grid {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 15px;
    }


    .feature-card {
      background: white;

      border: 1px solid #e3e3e3;

      border-radius: 15px;

      padding: 22px;

      min-height: 145px;

      text-align: left;

      cursor: pointer;

      transition: 0.2s;
    }


    .feature-card:hover {
      transform: translateY(-2px);

      border-color: #bbb;
    }


    .feature-icon {
      font-size: 28px;

      margin-bottom: 15px;
    }


    .feature-title {
      display: block;

      font-size: 17px;

      font-weight: bold;

      margin-bottom: 6px;
    }


    .feature-description {
      display: block;

      color: #888;

      font-size: 13px;

      line-height: 1.4;
    }



    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .dashboard {
        padding: 25px 15px;
      }


      .welcome h1 {
        font-size: 26px;
      }


      .feature-grid {
        gap: 10px;
      }


      .feature-card {
        min-height: 135px;

        padding: 17px;
      }

    }

  </style>

</head>



<body>


  <!-- =========================
       LOGIN PAGE
  ========================= -->

  <div id="loginPage">

    <div class="login-box">

      <div class="login-logo">
        NOVA 🌌
      </div>


      <div class="login-subtitle">
        Your world. Connected.
      </div>


      <div
        id="signupFields"
        style="display:none;"
      >

        <input
          type="text"
          id="name"
          placeholder="Your name"
        >

      </div>


      <input
        type="email"
        id="email"
        placeholder="Email address"
      >


      <input
        type="password"
        id="password"
        placeholder="Password"
      >


      <button
        class="login-button"
        id="mainButton"
      >
        Login
      </button>


      <div
        class="switch"
        id="switchMode"
      >
        Don't have an account?
        <span>Sign up</span>
      </div>


      <div id="message"></div>

    </div>

  </div>



  <!-- =========================
       HOME PAGE
  ========================= -->

  <div id="homePage">


    <header class="top-bar">

      <div class="nova-title">
        NOVA 🌌
      </div>


      <button
        class="logout-button"
        id="logoutButton"
      >
        Logout
      </button>

    </header>



    <main class="dashboard">


      <section class="welcome">

        <h1>
          Welcome, <span id="userName">there</span> 👋
        </h1>


        <p>
          Everything you need, in one place.
        </p>

      </section>



      <section class="feature-grid">


        <!-- CHAT -->

        <button
          class="feature-card"
          onclick="featureMessage('Chat')"
        >

          <div class="feature-icon">
            💬
          </div>


          <span class="feature-title">
            Chat
          </span>


          <span class="feature-description">
            Message your friends and family.
          </span>

        </button>



        <!-- DRIVE -->

        <button
          class="feature-card"
          onclick="featureMessage('NOVA Drive')"
        >

          <div class="feature-icon">
            📁
          </div>


          <span class="feature-title">
            NOVA Drive
          </span>


          <span class="feature-description">
            Store and share your files.
          </span>

        </button>



        <!-- AI -->

        <button
          class="feature-card"
          onclick="featureMessage('AI Assistant')"
        >

          <div class="feature-icon">
            🤖
          </div>


          <span class="feature-title">
            AI Assistant
          </span>


          <span class="feature-description">
            Get help from your personal AI.
          </span>

        </button>



        <!-- NEWS -->

        <button
          class="feature-card"
          onclick="featureMessage('News')"
        >

          <div class="feature-icon">
            📰
          </div>


          <span class="feature-title">
            News
          </span>


          <span class="feature-description">
