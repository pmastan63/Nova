<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA 🌌</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #111;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 25px 18px;
    }

    .card {
      background: white;
      padding: 22px;
      margin: 15px 0;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button.secondary {
      background: #e5e7eb;
      color: #111;
    }

    .feature {
      padding: 20px;
      margin: 12px 0;
      border-radius: 16px;
      background: white;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
      font-size: 18px;
    }

    #message {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
    }

    #app {
      display: none;
    }
  </style>
</head>

<body>

<header>
  🌌 NOVA
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="login">

    <div class="card">
      <h2>Welcome to NOVA 👋</h2>
      <p>Sign in to your NOVA account.</p>

      <input
        type="email"
        id="email"
        placeholder="Email address"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button onclick="signIn()">Sign In</button>

      <button class="secondary" onclick="signUp()">
        Create Account
      </button>

      <div id="message"></div>
    </div>

  </div>


  <!-- NOVA APP -->
  <div id="app">

    <div class="card">
      <h2>Welcome to NOVA 🌌</h2>
      <p id="userEmail"></p>

      <button class="secondary" onclick="signOut()">
        Sign Out
      </button>
    </div>

    <div class="feature">
      💬 <b>Chat</b>
      <br>
      <small>Talk with friends and family.</small>
    </div>

    <div class="feature">
      🤖 <b>AI</b>
      <br>
      <small>Ask NOVA anything.</small>
    </div>

    <div class="feature">
      📰 <b>News</b>
      <br>
      <small>Stay updated with the latest news.</small>
    </div>

    <div class="feature">
      🎮 <b>Games</b>
      <br>
      <small>Play simple games.</small>
    </div>

  </div>

</div>


<script>

  // ==============================
  // NOVA + SUPABASE CONNECTION
  // ==============================

  const SUPABASE_URL = "PASTE_YOUR_PROJECT_URL_HERE";

  const SUPABASE_PUBLISHABLE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  // ==============================
  // SIGN UP
  // ==============================

  async function signUp() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
      showMessage("Please enter email and password.");
      return;
    }

    const { error } = await db.auth.signUp({
      email: email,
      password: password
    });

    if (error) {
      showMessage(error.message);
      return;
    }

    showMessage(
      "Account created! Check your email to confirm your account."
    );
  }


  // ==============================
  // SIGN IN
  // ==============================

  async function signIn() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
      showMessage("Please enter email and password.");
      return;
    }

    const { error } = await db.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      showMessage(error.message);
      return;
    }

    showApp(email);
  }


  // ==============================
  // SIGN OUT
  // ==============================

  async function signOut() {

    await db.auth.signOut();

    document.getElementById("app").style.display = "none";
    document.getElementById("login").style.display = "block";
  }


  // ==============================
  // CHECK LOGIN
  // ==============================

  async function checkUser() {

    const {
      data: { session }
    } = await db.auth.getSession();

    if (session) {
      showApp(session.user.email);
    }
  }


  // ==============================
  // SHOW APP
  // ==============================

  function showApp(email) {

    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";

    document.getElementById("userEmail").textContent =
      "Signed in as: " + email;
  }


  // ==============================
  // MESSAGE
  // ==============================

  function showMessage(text) {
    document.getElementById("message").textContent = text;
  }


  checkUser();

</script>

</body>
</html>
